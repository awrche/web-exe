<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Form | Webexe Careers</title>
  <meta name="description" content="Apply for a role at Webexe by sending your CV and application details through our contact form.">
  <meta name="theme-color" content="#0f172a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="index.html" aria-label="Webexe home">
      <img src="logo.png" alt="Webexe logo">
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <div class="nav-row">
        <a href="index.html">Home</a>
        <a href="Company_Profile.html">Company Profile</a>
      </div>
      <div class="nav-row">
        <a href="Find_Us.html">Find Us</a>
        <a href="About.html">About</a>
      </div>
    </nav>
    <details class="accessibility-menu">
      <summary>Accessibility</summary>
      <div class="accessibility-panel">
        <div class="appearance-controls" role="group" aria-label="Appearance settings">
          <div class="bubble-control">
            <button id="bubbles-toggle" type="button" aria-pressed="false" aria-label="Bubbles: Off"><span>Bubbles</span><span class="appearance-switch" aria-hidden="true"></span></button>
            <div class="bubble-settings" aria-label="Bubble settings">
              <label class="bubble-setting">
                <span class="bubble-setting-row"><span>Rise speed</span><output id="bubble-speed-value" for="bubble-speed">100%</output></span>
                <input id="bubble-speed" type="range" min="50" max="200" step="10" value="100">
              </label>
              <label class="bubble-setting">
                <span class="bubble-setting-row"><span>Spawn rate</span><output id="bubble-rate-value" for="bubble-rate">1.1/s</output></span>
                <input id="bubble-rate" type="range" min="0.4" max="8" step="0.1" value="1.1">
              </label>
              <p class="bubble-settings-hint">Adjust how quickly bubbles rise and appear.</p>
            </div>
          </div>
          <div class="night-control">
            <button id="dark-mode-toggle" type="button" aria-pressed="false" aria-label="Dark mode: Off"><span>Dark mode</span><span class="appearance-switch" aria-hidden="true"></span></button>
            <div class="night-settings" role="group" aria-label="Additional appearance options">
              <button id="night-mode-toggle" type="button" aria-pressed="false" aria-label="Night mode: Off"><span>Night mode</span><span class="appearance-switch" aria-hidden="true"></span></button>
            </div>
          </div>
          <div class="music-control">
            <button id="music-toggle" type="button" aria-pressed="false" aria-label="Background music: Off"><span>Music</span><span class="appearance-switch" aria-hidden="true"></span></button>
            <div class="music-settings" role="group" aria-label="Music controls">
              <label class="music-volume-setting">
                <span class="music-volume-row"><span>Volume</span><output id="music-volume-value" for="music-volume">50%</output></span>
                <input id="music-volume" type="range" min="0" max="100" step="1" value="50">
              </label>
              <button id="music-mute-toggle" class="music-mute-toggle" type="button" aria-pressed="false" aria-label="Mute music">Mute</button>
              <span id="music-status" class="music-status" aria-live="polite"></span>
            </div>
          </div>
        </div>
      </div>
    </details>
  </header>

  <div class="bg-wrapper" aria-hidden="true">
    <picture>
      <source media="(max-width: 768px)" srcset="background-mobile.webp">
      <source media="(max-width: 1024px)" srcset="background-tablet.webp">
      <img src="background.webp" alt="" class="bg-image">
    </picture>
  </div>

  <main id="main-content" class="panel">
    <div class="page-shell wrap">
      <header class="page-header page-hero head">
        <h1>Apply for a Role</h1>
      </header>

      <p class="content-copy text">Send us your application details and upload your CV so we can review your experience.</p>

      <section class="job-list list" aria-label="Job application form">
        <form id="contactForm" class="job-card item contact-form" novalidate>
          <div class="form-grid">
            <label>
              Full name
              <input type="text" name="name" placeholder="Your full name" required>
            </label>

            <label>
              Email address
              <input type="email" name="email" placeholder="you@example.com" required>
            </label>

            <label>
              Role of interest
              <select id="roleInput" name="role" required>
                <option value="">Select a role</option>
                <option value="Web QA / Test Automation Engineer">Web QA / Test Automation Engineer</option>
                <option value="Mobile Web / PWA Developer">Mobile Web / PWA Developer</option>
                <option value="Headless / Jamstack Developer">Headless / Jamstack Developer</option>
                <option value="Web Accessibility (a11y) Specialist">Web Accessibility (a11y) Specialist</option>
                <option value="SEO & Technical Web Specialist">SEO & Technical Web Specialist</option>
                <option value="API / Integration Developer">API / Integration Developer</option>
                <option value="DevOps / Web Site Reliability Engineer (SRE)">DevOps / Web Site Reliability Engineer (SRE)</option>
                <option value="UI/UX Developer">UI/UX Developer</option>
                <option value="CMS / WordPress Developer">CMS / WordPress Developer</option>
                <option value="Web Security Engineer">Web Security Engineer</option>
                <option value="Web Performance Specialist / Optimization Engineer">Web Performance Specialist / Optimization Engineer</option>
                <option value="E-commerce Web Developer">E-commerce Web Developer</option>
              </select>
            </label>

            <label>
              Portfolio or LinkedIn
              <input type="url" name="website" placeholder="https://yourportfolio.com">
            </label>

            <label>
              CV upload
              <input type="file" name="cvUpload" accept=".pdf,.doc,.docx,.rtf" title="CV files (.pdf, .doc, .docx, .rtf)" required>
            </label>
          </div>

          <label>
            Cover message
            <textarea name="message" rows="7" placeholder="Tell us why you'd be a great fit for this role." required></textarea>
          </label>

          <div class="form-actions">
            <button type="submit" class="submit-btn">Send application</button>
          </div>
        </form>
      </section>
    </div>
  </main>

  <script src="site.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const roleParam = params.get('subject');
    const roleInput = document.getElementById('roleInput');

    if (roleParam) {
      const matchingOption = Array.from(roleInput.options).find((option) => option.value === roleParam);
      if (matchingOption) {
        roleInput.value = roleParam;
      } else {
        const fallback = document.createElement('option');
        fallback.value = roleParam;
        fallback.textContent = roleParam;
        roleInput.appendChild(fallback);
        roleInput.value = roleParam;
      }
    }

    const form = document.getElementById('contactForm');

    form.addEventListener('submit', (event) => {
      event.preventDefault();

      const formData = new FormData(form);
      const name = (formData.get('name') || '').toString().trim();
      const email = (formData.get('email') || '').toString().trim();
      const role = (formData.get('role') || '').toString().trim();
      const subject = role || 'Application enquiry';
      const website = (formData.get('website') || '').toString().trim();
      const message = (formData.get('message') || '').toString().trim();
      const cvFile = formData.get('cvUpload');
      const fileName = cvFile && cvFile.name ? cvFile.name : 'No CV uploaded';

      const body = [
        `Name: ${name}`,
        `Email: ${email}`,
        `Role: ${role}`,
        website ? `Portfolio / LinkedIn: ${website}` : '',
        `CV file: ${fileName}`,
        '',
        'Message:',
        message
      ].filter(Boolean).join('\n');

      window.location.href = `mailto:9900663113@exe-coll.ac.uk?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
    });
  </script>
</body>
</html>
