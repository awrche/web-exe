<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webexe | Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bg-wrapper">
    <picture>
      <source media="(max-width: 768px)" srcset="background-mobile.webp">
      <source media="(max-width: 1024px)" srcset="background-tablet.webp">
      <img src="background.webp" alt="" class="bg-image">
    </picture>
  </div>

  <div class="main-card">
    <div class="container">
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="Company_Profile.html">Company Profile</a>
        <a href="Find_Us.html">Find Us</a>
        <a href="About.html">About</a>
      </div>

      <div class="title">
        <h1 class="oswald-bold">Login</h1>
      </div>

      <div class="content">
        <p>Welcome back. Sign in to continue where you left off.</p>
      </div>

      <form class="auth-form" novalidate>
        <div class="form-group">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" name="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" name="password" placeholder="Enter your password">
        </div>
      </form>

      <div class="page-footer">
        <div class="footer-links">
          <a href="Sign_Up.html">Sign Up</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const loginEmailInput = document.getElementById('login-email');
    const loginPasswordInput = document.getElementById('login-password');

    function setGroupState(input, isInvalid) {
      const group = input.closest('.form-group');
      if (group) {
        group.classList.toggle('invalid', isInvalid);
      }
      input.setAttribute('aria-invalid', String(isInvalid));
    }

    function validateLoginEmail() {
      const value = loginEmailInput.value.trim();
      const invalid = value.length === 0 || !value.includes('@');
      setGroupState(loginEmailInput, invalid);
    }

    function validateLoginPassword() {
      const value = loginPasswordInput.value;
      const invalid = value.length < 8;
      setGroupState(loginPasswordInput, invalid);
    }

    loginEmailInput.addEventListener('blur', validateLoginEmail);
    loginEmailInput.addEventListener('input', validateLoginEmail);

    loginPasswordInput.addEventListener('blur', validateLoginPassword);
    loginPasswordInput.addEventListener('input', validateLoginPassword);
  </script>
</body>
</html>
