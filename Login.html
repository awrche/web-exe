<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login | Webexe</title>
  <meta name="description" content="Log in to your Webexe account to continue your digital journey, manage your account, and access updates.">
  <meta name="keywords" content="Webexe login, sign in, account access, digital company, website login">
  <meta name="robots" content="index, follow">
  <meta property="og:title" content="Login | Webexe">
  <meta property="og:description" content="Sign in to your Webexe account and continue exploring digital opportunities and online experiences.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="logo.png">
  <meta name="theme-color" content="#0f172a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="index.html" aria-label="Webexe home">
      <img src="logo.png" alt="Webexe logo">
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <div class="nav-row">
        <a href="index.html">Home</a>
        <a href="Company_Profile.html">Company Profile</a>
      </div>
      <div class="nav-row">
        <a href="Find_Us.html">Find Us</a>
        <a href="About.html">About</a>
      </div>
    </nav>
    <details class="accessibility-menu">
      <summary>Accessibility</summary>
      <div class="accessibility-panel">
        <div class="appearance-controls" role="group" aria-label="Appearance settings">
          <div class="bubble-control">
            <button id="bubbles-toggle" type="button" aria-pressed="false" aria-label="Bubbles: Off"><span>Bubbles</span><span class="appearance-switch" aria-hidden="true"></span></button>
            <div class="bubble-settings" aria-label="Bubble settings">
              <label class="bubble-setting">
                <span class="bubble-setting-row"><span>Rise speed</span><output id="bubble-speed-value" for="bubble-speed">100%</output></span>
                <input id="bubble-speed" type="range" min="50" max="200" step="10" value="100">
              </label>
              <label class="bubble-setting">
                <span class="bubble-setting-row"><span>Spawn rate</span><output id="bubble-rate-value" for="bubble-rate">1.1/s</output></span>
                <input id="bubble-rate" type="range" min="0.4" max="8" step="0.1" value="1.1">
              </label>
              <p class="bubble-settings-hint">Adjust how quickly bubbles rise and appear.</p>
            </div>
          </div>
          <div class="night-control">
            <button id="dark-mode-toggle" type="button" aria-pressed="false" aria-label="Dark mode: Off"><span>Dark mode</span><span class="appearance-switch" aria-hidden="true"></span></button>
            <div class="night-settings" role="group" aria-label="Additional appearance options">
              <button id="night-mode-toggle" type="button" aria-pressed="false" aria-label="Night mode: Off"><span>Night mode</span><span class="appearance-switch" aria-hidden="true"></span></button>
            </div>
          </div>
          <div class="music-control">
            <button id="music-toggle" type="button" aria-pressed="false" aria-label="Background music: Off"><span>Music</span><span class="appearance-switch" aria-hidden="true"></span></button>
            <div class="music-settings" role="group" aria-label="Music controls">
              <label class="music-volume-setting">
                <span class="music-volume-row"><span>Volume</span><output id="music-volume-value" for="music-volume">100%</output></span>
                <input id="music-volume" type="range" min="0" max="100" step="1" value="100">
              </label>
              <button id="music-mute-toggle" class="music-mute-toggle" type="button" aria-pressed="false" aria-label="Mute music">Mute</button>
              <span id="music-status" class="music-status" aria-live="polite"></span>
            </div>
          </div>
        </div>
      </div>
    </details>
  </header>
  <script src="site.js"></script>

  <div class="bg-wrapper" aria-hidden="true">
    <picture>
      <source media="(max-width: 768px)" srcset="background-mobile.webp">
      <source media="(max-width: 1024px)" srcset="background-tablet.webp">
      <img src="background.webp" alt="" class="bg-image" fetchpriority="high">
    </picture>
  </div>

  <main id="main-content" class="panel">
    <div class="page-shell wrap">
      <header class="page-header page-hero head">
        <h1 id="login-heading" class="oswald-bold">Login</h1>
      </header>

      <section class="content-copy text" aria-labelledby="login-heading">
        <p>Welcome back. Sign in to continue where you left off.</p>
      </section>

      <form class="form" aria-labelledby="login-heading" novalidate>
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" name="email" placeholder="Enter your email" autocomplete="email">
          <span class="error-message" aria-live="polite"></span>
        </div>

        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" name="password" placeholder="Enter your password" autocomplete="current-password">
          <span class="error-message" aria-live="polite"></span>
        </div>
      </form>

      <footer class="page-footer foot">
        <nav class="links" aria-label="Account actions">
          <a href="Sign_Up.html">Login</a>
        </nav>
      </footer>
    </div>
  </main>

  <script>
    const loginEmailInput = document.getElementById('login-email');
    const loginPasswordInput = document.getElementById('login-password');

    function setGroupState(input, isInvalid, message) {
      const group = input.closest('.field');
      const errorMessage = group ? group.querySelector('.error-message') : null;
      if (group) {
        group.classList.toggle('invalid', isInvalid);
      }
      if (errorMessage) {
        errorMessage.textContent = isInvalid ? message : '';
      }
      input.setAttribute('aria-invalid', String(isInvalid));
    }

    function validateLoginEmail() {
      const value = loginEmailInput.value.trim();
      const invalid = value.length === 0 || !value.includes('@');
      setGroupState(loginEmailInput, invalid, 'Please enter a valid email address.');
    }

    function validateLoginPassword() {
      const value = loginPasswordInput.value;
      const invalid = value.length < 8;
      setGroupState(loginPasswordInput, invalid, 'Please enter a valid password.');
    }

    loginEmailInput.addEventListener('blur', validateLoginEmail);
    loginEmailInput.addEventListener('input', validateLoginEmail);

    loginPasswordInput.addEventListener('blur', validateLoginPassword);
    loginPasswordInput.addEventListener('input', validateLoginPassword);
  </script>
</body>
</html>
