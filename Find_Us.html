<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webexe | Find Us</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow-x: hidden;
      font-family: Arial, sans-serif;
      color: #1a1a1a;
    }

    .bg-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      overflow: hidden;
    }

    .bg-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .main-card {
      background-color: rgba(189, 234, 255, 0.7);
      backdrop-filter: blur(8px);
      width: 90%;
      max-width: 900px;
      padding: 40px 30px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      box-sizing: border-box;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 20px;
    }

    h1 {
      margin: 0;
      font-family: "Oswald", sans-serif;
      font-size: 3.5rem;
    }

    .nav-links {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
      justify-content: center;
      margin-bottom: 10px;
    }

    .nav-links a {
      text-decoration: none;
      color: #1f2937;
      font-weight: 600;
    }

    .nav-links a:hover {
      color: #0057d9;
    }

    .content {
      max-width: 620px;
      line-height: 1.7;
      font-size: 1.05rem;
    }

    .location {
      background: rgba(240, 248, 255, 0.9);
      border: 1px solid rgba(0, 0, 0, 0.08);
      border-radius: 12px;
      padding: 18px 22px;
      width: 100%;
      max-width: 520px;
      box-sizing: border-box;
    }

    @media (max-width: 768px) {
      h1 {
        font-size: 2.5rem;
      }

      .main-card {
        padding: 30px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-wrapper">
    <picture>
      <source media="(max-width: 768px)" srcset="background-mobile.webp">
      <source media="(max-width: 1024px)" srcset="background-tablet.webp">
      <img src="background.webp" alt="" class="bg-image">
    </picture>
  </div>

  <div class="main-card">
    <div class="container">
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="Company_Profile.html">Company Profile</a>
        <a href="Find_Us.html">Find Us</a>
        <a href="About.html">About</a>
      </div>

      <h1>Find Us</h1>

      <div class="location">
        <p><strong>Webexe Headquarters</strong></p>
        <p>123 Future Avenue</p>
        <p>Innovation District</p>
        <p>Open Monday to Friday, 9:00 AM - 5:00 PM</p>
      </div>

      <div class="content">
        <p>We are located in the heart of the city, where creativity and collaboration shape the next generation of digital experiences.</p>
      </div>
    </div>
  </div>
</body>
</html>
