<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webexe | Sign Up</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@700&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Oswald:wght@700&display=swap" rel="stylesheet"></noscript>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a class="site-logo" href="index.html" aria-label="Webexe home">
      <img src="logo.png" alt="">
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      <div class="site-nav-row">
        <a href="index.html">Home</a>
        <a href="Company_Profile.html">Company Profile</a>
      </div>
      <div class="site-nav-row">
        <a href="Find_Us.html">Find Us</a>
        <a href="About.html">About</a>
      </div>
    </nav>
    <details class="accessibility-menu">
      <summary>Accessibility</summary>
      <div class="accessibility-panel">
      <div class="appearance-controls" role="group" aria-label="Appearance settings">
      <div class="bubble-control">
        <button id="bubbles-toggle" type="button" aria-pressed="false" aria-label="Bubbles: Off"><span>Bubbles</span><span class="appearance-switch" aria-hidden="true"></span></button>
        <div class="bubble-settings" aria-label="Bubble settings">
          <label class="bubble-setting">
            <span class="bubble-setting-heading"><span>Rise speed</span><output id="bubble-speed-value" for="bubble-speed">100%</output></span>
            <input id="bubble-speed" type="range" min="50" max="200" step="10" value="100">
          </label>
          <label class="bubble-setting">
            <span class="bubble-setting-heading"><span>Spawn rate</span><output id="bubble-rate-value" for="bubble-rate">1.1/s</output></span>
            <input id="bubble-rate" type="range" min="0.4" max="8" step="0.1" value="1.1">
          </label>
          <p class="bubble-settings-hint">Adjust how quickly bubbles rise and appear.</p>
        </div>
      </div>
      <div class="night-control">
        <button id="dark-mode-toggle" type="button" aria-pressed="false" aria-label="Dark mode: Off"><span>Dark mode</span><span class="appearance-switch" aria-hidden="true"></span></button>
        <div class="night-settings" role="group" aria-label="Additional appearance options">
          <button id="night-mode-toggle" type="button" aria-pressed="false" aria-label="Night mode: Off"><span>Night mode</span><span class="appearance-switch" aria-hidden="true"></span></button>
        </div>
      </div>
      <div class="music-control">
        <button id="music-toggle" type="button" aria-pressed="false" aria-label="Background music: Off"><span>Music</span><span class="appearance-switch" aria-hidden="true"></span></button>
        <div class="music-settings" role="group" aria-label="Music controls">
          <label class="music-volume-setting">
            <span class="music-volume-heading"><span>Volume</span><output id="music-volume-value" for="music-volume">100%</output></span>
            <input id="music-volume" type="range" min="0" max="100" step="1" value="100">
          </label>
          <button id="music-mute-toggle" class="music-mute-toggle" type="button" aria-pressed="false" aria-label="Mute music">Mute</button>
          <span id="music-status" class="music-status" aria-live="polite"></span>
        </div>
      </div>
      </div>
    </details>
  </header>
  <script src="site.js"></script>
  <div class="bg-wrapper">
    <picture>
      <source media="(max-width: 768px)" srcset="background-mobile.webp">
      <source media="(max-width: 1024px)" srcset="background-tablet.webp">
      <img src="background.webp" alt="" class="bg-image" fetchpriority="high">
    </picture>
  </div>

  <div class="main-card">
    <div class="container">
      <div class="title">
        <h1 class="oswald-bold">Sign Up</h1>
      </div>

      <div class="content">
        <p>Create your Webexe account and join the next step in your journey.</p>
      </div>

      <form class="auth-form" novalidate>
        <div class="form-group">
          <label for="signup-email">Email</label>
          <input id="signup-email" type="email" name="email" placeholder="Enter your email">
        </div>

        <div class="form-group">
          <label for="signup-password">Password</label>
          <input id="signup-password" type="password" name="password" placeholder="Create a password">
        </div>

        <div class="form-group">
          <label for="signup-code">Email Code</label>
          <div class="code-row">
            <input id="signup-code" type="text" name="email-code" placeholder="Enter your email code" class="code-input">
            <button type="button" class="send-code-btn">Send code</button>
          </div>
        </div>
      </form>

      <div class="page-footer">
        <div class="footer-links">
          <a href="Login.html">Login</a>
        </div>
      </div>
    </div>
  </div>

  <script>
    const emailInput = document.getElementById('signup-email');
    const passwordInput = document.getElementById('signup-password');
    const codeInput = document.getElementById('signup-code');
    const sendCodeBtn = document.querySelector('.send-code-btn');
    let generatedCode = '';

    function setGroupState(input, isInvalid) {
      const group = input.closest('.form-group');
      if (group) {
        group.classList.toggle('invalid', isInvalid);
      }
      input.setAttribute('aria-invalid', String(isInvalid));
    }

    function validateEmail() {
      const value = emailInput.value.trim();
      const invalid = value.length === 0 || !value.includes('@');
      setGroupState(emailInput, invalid);
      return !invalid;
    }

    function validatePassword() {
      const value = passwordInput.value;
      const invalid = value.length < 8;
      setGroupState(passwordInput, invalid);
      return !invalid;
    }

    function validateCode() {
      const value = codeInput.value.trim();
      const invalid = value.length === 0 || value !== generatedCode;
      setGroupState(codeInput, invalid);
      return !invalid;
    }

    emailInput.addEventListener('blur', validateEmail);
    emailInput.addEventListener('input', validateEmail);

    passwordInput.addEventListener('blur', validatePassword);
    passwordInput.addEventListener('input', validatePassword);

    codeInput.addEventListener('blur', validateCode);
    codeInput.addEventListener('input', () => {
      if (codeInput.value.trim() !== '') {
        validateCode();
      } else {
        setGroupState(codeInput, false);
      }
    });

    sendCodeBtn.addEventListener('click', () => {
      generatedCode = String(Math.floor(100000 + Math.random() * 900000));
      codeInput.value = '';
      setGroupState(codeInput, false);
      alert('Your code is: ' + generatedCode);
    });
  </script>
</body>
</html>
