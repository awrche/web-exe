<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Webexe | Chess</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="chess.css">
</head>
<body class="chess-page">
  <div class="easter-egg-topbar">
    <a href="index.html" class="easter-egg-button">Home</a>
    <a href="Easter_Egg.html" class="easter-egg-button">Back</a>
  </div>

  <main class="chess-layout">
    <section class="chess-panel" aria-label="Chess game">
      <div class="chess-header">
        <h1>Chess</h1>
        <button id="reset-game" type="button" class="reset-button">New Game</button>
      </div>

      <div class="difficulty-row">
        <label for="difficulty-level" class="difficulty-label">Difficulty</label>
        <select id="difficulty-level" class="difficulty-select" aria-label="Select chess difficulty">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="impossible">Impossible</option>
        </select>
      </div>

      <p class="piece-values">Piece values: Pawn 1, Knight 3, Bishop 3, Rook 5, Queen 9, King 0</p>

      <div class="scoreboard" aria-label="Scoreboard">
        <div class="score-box" aria-label="White captured pieces">
          <span class="score-label">White</span>
          <strong id="white-score">0</strong>
          <span id="white-score-tooltip" class="score-tooltip">No captures yet</span>
        </div>
        <div class="score-box" aria-label="Bot captured pieces">
          <span class="score-label">Bot</span>
          <strong id="bot-score">0</strong>
          <span id="bot-score-tooltip" class="score-tooltip">No captures yet</span>
        </div>
      </div>

      <p id="game-status" class="chess-status">White to move</p>

      <div id="chessboard" class="chessboard" aria-label="Chess board" role="grid"></div>

      <div class="chess-move-history" aria-live="polite">
        <h2>Move History</h2>
        <ul id="move-history" class="history-list"></ul>
      </div>
    </section>
  </main>

  <script src="chess.js"></script>
</body>
</html>
